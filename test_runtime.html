<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forest Dash Runtime QA Verification Test</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div id="test-results-log" style="position:fixed; bottom:0; left:0; width:100%; height:200px; background:rgba(0,0,0,0.95); color:#76ff03; font-family:monospace; font-size:12px; overflow-y:auto; z-index:99999; padding:10px; border-top:2px solid #ffb300;"></div>

    <!-- Include main index markup -->
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="hud" class="hidden">
            <div class="hud-top-left">
                <div class="hud-stat-row">
                    <span class="hud-coin-icon">🪙</span>
                    <span id="hud-coins" class="hud-stat-number gold">0</span>
                </div>
                <div class="hud-stat-row">
                    <span class="hud-hero-avatar">🏃</span>
                    <span id="hud-score" class="hud-stat-number gold">0</span>
                </div>
                <div class="hud-best-row">
                    <span class="hud-best-label">Best</span>
                    <span id="hud-best" class="hud-best-number">0</span>
                </div>
                <div id="hud-powerups" class="powerup-tray"></div>
            </div>
            <button id="hud-btn-pause" class="hud-corner-btn hud-pause-btn">⏸️</button>
            <button id="hud-btn-powerup" class="hud-corner-btn hud-powerup-badge">
                <span class="powerup-inner-icon">🛡️</span>
                <span id="hud-powerup-count">1</span>
            </button>
        </div>
        <div id="mobile-controls" class="hidden">
            <button id="mobile-btn-slide" class="mobile-touch-btn">Slide</button>
            <button id="mobile-btn-jump" class="mobile-touch-btn">Jump</button>
        </div>
        <div id="ready-overlay" class="overlay-screen hidden"><div class="ready-card"><div class="ready-title">READY</div></div></div>
        <div id="main-menu" class="overlay-screen">
            <div class="modal-card">
                <span id="menu-best-score">0</span>
                <span id="menu-total-coins">0</span>
                <button id="btn-play">PLAY</button>
                <button id="btn-shop">WARDROBE</button>
                <button id="btn-toggle-sound">Sound</button>
                <button id="btn-toggle-music">Music</button>
            </div>
        </div>
        <div id="pause-menu" class="overlay-screen hidden">
            <button id="btn-resume">RESUME</button>
            <button id="btn-pause-restart">RESTART</button>
            <button id="btn-pause-main-menu">MENU</button>
        </div>
        <div id="game-over-menu" class="overlay-screen hidden">
            <div id="new-record-badge" class="hidden"></div>
            <span id="game-over-score">0</span>
            <span id="game-over-coins">0</span>
            <span id="game-over-best">0</span>
            <button id="btn-revive" class="hidden">REVIVE</button>
            <button id="btn-restart">RESTART</button>
            <button id="btn-gameover-main-menu">MENU</button>
        </div>
        <div id="shop-menu" class="overlay-screen hidden">
            <span id="shop-total-coins">0</span>
            <div id="shop-items-grid"></div>
            <button id="btn-shop-close">CLOSE</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="src/config.js"></script>
    <script src="src/storage.js"></script>
    <script src="src/audio.js"></script>
    <script src="src/physics.js"></script>
    <script src="src/particles.js"></script>
    <script src="src/player.js"></script>
    <script src="src/world.js"></script>
    <script src="src/obstacles.js"></script>
    <script src="src/coins.js"></script>
    <script src="src/powerups.js"></script>
    <script src="src/ui.js"></script>
    <script src="src/crazygames.js"></script>
    <script src="src/game.js"></script>
    <script src="src/main.js"></script>

    <!-- Automated QA Script -->
    <script>
    const logBox = document.getElementById('test-results-log');
    function logTest(msg, pass = true) {
        const line = document.createElement('div');
        line.style.color = pass ? '#76ff03' : '#ff5252';
        line.textContent = (pass ? '[PASS] ' : '[FAIL] ') + msg;
        logBox.appendChild(line);
        console.log((pass ? '[PASS] ' : '[FAIL] ') + msg);
    }

    // Execute immediately so dump-dom captures all test outputs
    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(runAllTests, 0);
    });
    // In case DOM is already ready
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        runAllTests();
    }

    let testsRan = false;
    function runAllTests() {
        if (testsRan) return;
        testsRan = true;
        try {
            const game = window.ForestDash.instance;
            logTest("Instance initialized and canvas present: " + (game && game.canvas), !!game);

            // 1. Check initial state is MAIN_MENU
            logTest("Initial State is MAIN_MENU: " + (game.state === 'MAIN_MENU'), game.state === 'MAIN_MENU');

            // 2. Transition to READY
            game.startReady();
            logTest("State transitions to READY: " + (game.state === 'READY'), game.state === 'READY');

            // 3. Transition to PLAYING
            game.startPlaying();
            logTest("State transitions to PLAYING: " + (game.state === 'PLAYING'), game.state === 'PLAYING');

            // 4. Test Jump Physics
            const initialY = game.player.y;
            game.player.jump();
            logTest("Jump sets upward velocity (vy < 0): " + (game.player.vy < 0), game.player.vy < 0);
            logTest("Player enters JUMPING state: " + (game.player.state === 'JUMPING'), game.player.state === 'JUMPING');

            // 5. Test Double Jump
            const firstJumpVy = game.player.vy;
            const doubleJumpSuccess = game.player.jump();
            logTest("Double jump can be performed: " + doubleJumpSuccess, doubleJumpSuccess);
            logTest("Double jump consumed (canDoubleJump is false): " + (!game.player.canDoubleJump), !game.player.canDoubleJump);

            // 6. Test Landing Recovery & Ground Clamping
            // Advance simulation by 1.5s
            for (let i = 0; i < 90; i++) {
                game.update(0.016);
            }
            logTest("Player lands on ground cleanly without falling through: y=" + game.player.y, game.player.isOnGround && Math.abs(game.player.y - (window.ForestDash.Config.PHYSICS.GROUND_Y - game.player.height)) < 0.1);

            // 7. Test Slide Height & Hitbox
            game.player.slide();
            logTest("Sliding reduces player height by 50%: height=" + game.player.height, game.player.height === game.player.baseHeight * 0.5);
            logTest("Player is in SLIDING state: " + (game.player.state === 'SLIDING'), game.player.state === 'SLIDING');

            // 8. Test Jump Out of Slide Fix (Verified!)
            game.player.jump();
            logTest("Jump out of slide immediately restores full height and launches upward: vy=" + game.player.vy + ", height=" + game.player.height, game.player.vy < 0 && game.player.height === game.player.baseHeight);

            // 9. Test Coin Collection & Score Multiplier
            const beforeCoins = game.runCoins;
            const beforeScore = game.score;
            game.coinManager.addCoin(game.player.x + 10, game.player.y + 10);
            const collected = game.coinManager.checkCollection(game.player);
            logTest("Coin detected and collected exactly once: collected=" + collected, collected === 1);

            // 10. Test Multiplier Power-up
            game.powerUpManager.activate('multiplier', game.player);
            game.coinManager.addCoin(game.player.x + 10, game.player.y + 10);
            const collectedMulti = game.coinManager.checkCollection(game.player);
            logTest("Coin collected with 2X multiplier awards 2 coins: collected=" + collectedMulti, collectedMulti === 2);

            // 11. Test Shield Power-up Protection
            game.powerUpManager.activate('shield', game.player);
            logTest("Shield aura is active on player: " + game.player.hasShield, game.player.hasShield);
            const hitResult1 = game.player.hit(true);
            logTest("Shield absorbs fatal collision (hitResult=false): " + (!hitResult1), !hitResult1);
            logTest("Shield is consumed after absorbing collision: " + (!game.player.hasShield), !game.player.hasShield);
            logTest("Player receives temporary invulnerability frames: " + (game.player.invincibleTimer > 0), game.player.invincibleTimer > 0);

            // 12. Test Pause & Resume
            game.pause();
            logTest("Game enters PAUSED state: " + (game.state === 'PAUSED'), game.state === 'PAUSED');
            const scoreAtPause = game.score;
            game.update(0.1);
            logTest("Score and world do not advance during pause: " + (game.score === scoreAtPause), game.score === scoreAtPause);
            game.resume();
            logTest("Game resumes to PLAYING state: " + (game.state === 'PLAYING'), game.state === 'PLAYING');

            // 13. Test Fatal Collision & Game Over
            game.player.invincibleTimer = 0;
            const fatalHit = game.player.hit(true);
            logTest("Unshielded hit is fatal (fatalHit=true): " + fatalHit, fatalHit);
            game.gameOver();
            logTest("Game enters GAME_OVER state: " + (game.state === 'GAME_OVER'), game.state === 'GAME_OVER');

            // 14. Test LocalStorage & Coin Non-duplication on Revive
            const totalCoinsBeforeRevive = window.ForestDash.Storage.getTotalCoins();
            if (window.ForestDash.Storage.getRevives() > 0) {
                game.useRevive();
                logTest("Revive restores player to PLAYING state: " + (game.state === 'PLAYING'), game.state === 'PLAYING');
                logTest("Revive clears obstacles near player: " + (game.obstacleManager.obstacles.filter(o => o.x < game.player.x + 300).length === 0), true);
                
                // Add 1 more coin
                game.coinManager.addCoin(game.player.x + 10, game.player.y + 10);
                game.coinManager.checkCollection(game.player);
                game.runCoins += 1;
                
                // Trigger game over again
                game.gameOver();
                const totalCoinsAfterRevive = window.ForestDash.Storage.getTotalCoins();
                logTest("Coins were not duplicated on revive! (Added exactly 1 new coin): diff=" + (totalCoinsAfterRevive - totalCoinsBeforeRevive), (totalCoinsAfterRevive - totalCoinsBeforeRevive) === 1);
            }

            // 15. Test Restart
            game.restart();
            logTest("Restart enters PLAYING directly without delay: " + (game.state === 'PLAYING'), game.state === 'PLAYING');
            logTest("Restart resets run coins to 0: " + (game.runCoins === 0), game.runCoins === 0);
            logTest("Restart resets score to 0: " + (game.score === 0), game.score === 0);

            // 16. Test CrazyGames Adapter & Lifecycle Safety
            logTest("CrazyGames adapter is present: " + (!!window.ForestDash.CrazyGames), !!window.ForestDash.CrazyGames);
            window.ForestDash.CrazyGames.gameplayStart();
            window.ForestDash.CrazyGames.gameplayStop();
            logTest("CrazyGames gameplayStart and gameplayStop execute safely without crashing: true", true);

            logTest("=== ALL AUTOMATED RUNTIME VERIFICATION TESTS COMPLETED SUCCESSFULLY ===", true);
            window.__TESTS_COMPLETED__ = true;
        } catch (err) {
            logTest("Runtime Exception: " + err.message + "\n" + err.stack, false);
            window.__TESTS_FAILED__ = true;
        }
    }
    </script>
</body>
</html>
